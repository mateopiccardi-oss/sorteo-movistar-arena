[build]
# Netlify SOLO hostea lo publico: formulario_inscripcion.html, redirect /s/* y favicon.
# El admin (index.html) se sirve desde GitHub Pages — sus cambios NO deben redeployar Netlify.
# sorteo_script.gs es Apps Script (deploy manual), tampoco dispara redeploy.
ignore = "git diff --quiet HEAD^ HEAD -- formulario_inscripcion.html s/ _redirects favicon.svg netlify.toml"
